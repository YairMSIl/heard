name = "heard"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Served at https://heard.yairms.workers.dev.
workers_dev = true
# Preview URLs are off: they would expose every uploaded version at a public
# hostname while bound to the *production* D1 database.
preview_urls = false

# ADMIN_TOKEN is a secret in production:
#   wrangler secret put ADMIN_TOKEN
# For local dev it is read from .dev.vars (gitignored, see .dev.vars.example).
[vars]
# Nothing here on purpose. Do not put ADMIN_TOKEN in this file.

[[d1_databases]]
binding = "DB"
database_name = "heard"
# Created with `wrangler d1 create heard` (region WEUR).
# Local dev (`wrangler dev`) uses a local SQLite file under .wrangler/state and
# ignores this id entirely.
database_id = "cde604b3-118a-4296-a9af-e9ff6898d898"

[triggers]
# Daily retention sweep (03:17 UTC, off the top of the hour to avoid the
# stampede every other cron on the platform joins).
crons = ["17 3 * * *"]
