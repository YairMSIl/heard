name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Blocking: advisories in what actually ships to the Worker. The deployed
      # bundle is our source plus hono; everything else is build and test tooling.
      - run: npm audit --audit-level=high --omit=dev
      # The whole tree, dev tooling included. This was informational while the
      # toolchain lagged behind Node 22; it is blocking now that it passes, so a
      # regression is caught rather than noted.
      - run: npm audit --audit-level=high
